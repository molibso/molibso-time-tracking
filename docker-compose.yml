# Local PostgreSQL for molibso Internal
# Start:  npm run db:up
# Stop:   npm run db:down

services:
  postgres:
    image: postgres:16-alpine
    container_name: molibso-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: molibso
      POSTGRES_PASSWORD: molibso
      POSTGRES_DB: molibso
    volumes:
      - molibso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molibso -d molibso"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  molibso_pgdata:
