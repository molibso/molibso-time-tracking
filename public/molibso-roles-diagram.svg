  <text x="300" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E2B33">EMPLOYEE</text>
  <text x="300" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Demo: employee@molibso.de</text>

  <text x="120" y="255" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Clock in / out &amp; take breaks</text>
  <text x="120" y="290" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" View own time tracking history</text>
  <text x="120" y="325" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Request leave &amp; see balance</text>
  <text x="120" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" View own attendance calendar</text>
  <text x="120" y="395" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Edit own profile</text>

  <rect x="140" y="440" width="320" height="40" rx="8" fill="#E8F6FC"/>
  <text x="300" y="466" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0073AA">Sees only self</text>

  <!-- Arrow -->
  <line x1="540" y1="340" x2="650" y2="340" stroke="#0073AA" stroke-width="2"/>
  <polygon points="650,334 665,340 650,346" fill="#0073AA"/>
  <text x="595" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0073AA">requests �</text>
  <text x="595" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0073AA">approvals</text>

  <!-- Boss card -->
  <rect x="680" y="130" width="440" height="440" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="680" y="130" width="440" height="8" rx="4" fill="#0073AA"/>
  <text x="900" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E2B33">BOSS</text>
  <text x="900" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Demo: admin@molibso.de</text>

  <text x="720" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Everything an employee can do</text>
  <text x="720" y="280" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" See all teammates hours &amp; availability</text>
  <text x="720" y="310" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Approve leave for everyone</text>
  <text x="720" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Approve time corrections</text>
  <text x="720" y="370" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Manage all team members</text>
  <text x="720" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4F4B51">" Analytics &amp; company settings</text>

  <rect x="740" y="440" width="320" height="40" rx="8" fill="#E8F6FC"/>
  <text x="900" y="466" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0073AA">Sees &amp; manages everyone</text>

  <text x="600" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">No departments � No mid-level managers � Small flat team</text>
  <text x="600" y="645" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#AAAAAA">molibso GmbH � Internal tool</text>
